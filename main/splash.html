<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .splash-container {
      text-align: center;
    }
    .splash-logo {
      width: 200px;
      height: 200px;
      animation: spin 20s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .splash-title {
      color: #61DAFB;
      font-size: 36px;
      font-weight: 300;
      margin-top: 20px;
      letter-spacing: 4px;
    }
    .splash-loading {
      color: #888;
      font-size: 14px;
      margin-top: 30px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="./splash.svg" class="splash-logo" alt="Monolith" />
    <div class="splash-title">MONOLITH</div>
    <div class="splash-loading">Loading...</div>
  </div>
</body>
</html>
