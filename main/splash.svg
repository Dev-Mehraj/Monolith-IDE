<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dc1cc"/>
      <stop offset="55%" stop-color="#3a8fe0"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    <filter id="mGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer hex frame -->
  <polygon points="100,8 176,52 176,148 100,192 24,148 24,52"
    fill="none" stroke="url(#mGrad)" stroke-width="2.5" opacity="0.55"/>

  <!-- inner hex frame, offset for depth -->
  <polygon points="100,28 158,62 158,138 100,172 42,138 42,62"
    fill="none" stroke="#4dc1cc" stroke-width="1" opacity="0.35"/>

  <!-- monogram M built from angular strokes, glowing -->
  <g filter="url(#mGlow)">
    <path d="M62 138 L62 66 L100 112 L138 66 L138 138"
      fill="none" stroke="url(#mGrad)" stroke-width="10"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- core node -->
  <circle cx="100" cy="112" r="6" fill="#e8f6ff"/>

  <!-- corner accent nodes -->
  <circle cx="100" cy="8" r="3.5" fill="#4dc1cc"/>
  <circle cx="176" cy="52" r="3.5" fill="#3a8fe0"/>
  <circle cx="176" cy="148" r="3.5" fill="#3a8fe0"/>
  <circle cx="100" cy="192" r="3.5" fill="#4dc1cc"/>
  <circle cx="24" cy="148" r="3.5" fill="#3a8fe0"/>
  <circle cx="24" cy="52" r="3.5" fill="#3a8fe0"/>
</svg>
